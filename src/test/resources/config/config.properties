# ---------------------------------------------------------------------------
#  Framework configuration
#
#  Every value here can be overridden on the command line without editing the
#  file:
#      mvn clean test -Dbrowser=firefox -Dheadless=true
#
#  Precedence: -D system property  >  environment variable  >  this file.
#  (See com.qa.utils.ConfigReader.)
# ---------------------------------------------------------------------------

# ---------- Application under test ----------
base.url=https://automationexercise.com
api.base.uri=https://automationexercise.com

# ---------- Browser ----------
# chrome | firefox | edge
browser=chrome
headless=false

# ---------- Timeouts (seconds unless stated) ----------
# 30s rather than a tighter number: the target is a public site reached over the
# internet, and a CI runner's latency to it differs from a laptop's. This is a
# bounded explicit wait - it returns as soon as the element appears, so the extra
# headroom costs nothing when the site is responsive.
explicit.wait=30
page.load.timeout=45
# Used by negative assertions ("this error must NOT appear"), where waiting the
# full explicit.wait for something that should be absent would waste 20s per test.
short.wait=5
# Explicit-wait polling interval, in milliseconds.
poll.interval=250

# ---------- Reporting ----------
report.dir=reports
screenshot.dir=reports/screenshots
screenshot.on.failure=true

# ---------- Retry ----------
# Maximum re-runs of a failed test. 1 = one retry. 0 disables retrying entirely.
# See com.qa.listeners.RetryAnalyzer for why this is not set higher.
retry.count=1

# ---------- API ----------
api.log.requests=true

# ---------- Payment test data ----------
# Dummy card values for the practice site's checkout form. This site processes
# nothing: there is no payment gateway behind it. 4111111111111111 is the
# publicly documented Visa test number, not anyone's card.
payment.card.name=QA Automation
payment.card.number=4111111111111111
payment.card.cvc=311
payment.card.expiry.month=12
payment.card.expiry.year=2030
